name: AI Agent
on: [workflow_dispatch]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python -c "
          import asyncio, os
          from gpt_researcher import GPTResearcher
          async def m():
            os.environ['LLM_PROVIDER'] = 'google'
            os.environ['FAST_LLM'] = 'gemini-2.5-flash'
            os.environ['SMART_LLM'] = 'gemini-2.5-pro'
            r = GPTResearcher(query='Mathematical methods', report_type='research_report')
            await r.conduct_research()
            rep = await r.write_report()
            os.makedirs('reports', exist_ok=True)
            with open('reports/output_report.md', 'w', encoding='utf-8') as f: f.write(rep)
          asyncio.run(m())
          "
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/output_report.md
