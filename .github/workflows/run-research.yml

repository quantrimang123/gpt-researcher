name: AI Research Agent

on:
  workflow_dispatch:
    inputs:
      research_query:
        description: 'Chủ đề cần nghiên cứu:'
        required: true
        default: 'Find and extract mathematical methods for advanced reinforcement learning.'

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Researcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python -c "
          import asyncio
          import os
          from gpt_researcher import GPTResearcher

          async def main():
              query = os.environ.get('RESEARCH_QUERY', 'Mathematical methods research')
              os.environ['LLM_PROVIDER'] = 'google'
              os.environ['FAST_LLM'] = 'gemini-2.5-flash'
              os.environ['SMART_LLM'] = 'gemini-2.5-pro'
              os.environ['STRATEGIC_LLM'] = 'gemini-2.5-pro'

              researcher = GPTResearcher(query=query, report_type='research_report', report_format='markdown')
              await researcher.conduct_research()
              report = await researcher.write_report()

              os.makedirs('reports', exist_ok=True)
              with open('reports/output_report.md', 'w', encoding='utf-8') as f:
                  f.write(report)

          asyncio.run(main())
          "

      - name: Save report artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-report
          path: reports/output_report.md
