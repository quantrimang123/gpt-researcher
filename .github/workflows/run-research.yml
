name: AI Research Agent (Gemini)

on:
  # Cho phép bấm chạy thủ công trên GitHub UI (Tab Actions)
  workflow_dispatch:
    inputs:
      research_query:
        description: 'Chủ đề hoặc bài toán toán học cần nghiên cứu:'
        required: true
        default: 'Find and extract mathematical methods for advanced reinforcement learning.'
      report_type:
        description: 'Loại báo cáo:'
        required: true
        default: 'research_report'

  # (Tuỳ chọn) Tự động chạy định kỳ, ví dụ: 8 giờ sáng mỗi Chủ Nhật
  # schedule:
  #   - cron: '0 8 * * 0'

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Create environment configuration
        run: |
          echo "LLM_PROVIDER=google" >> .env
          echo "FAST_LLM=gemini-2.5-flash" >> .env
          echo "SMART_LLM=gemini-2.5-pro" >> .env
          echo "STRATEGIC_LLM=gemini-2.5-pro" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" >> .env

      - name: 5. Run AI Research Agent
        env:
          RESEARCH_QUERY: ${{ github.event.inputs.research_query }}
          REPORT_TYPE: ${{ github.event.inputs.report_type }}
        run: |
          python -c "
          import asyncio
          import os
          from gpt_researcher import GPTResearcher

          async def main():
              query = os.environ.get('RESEARCH_QUERY', 'Mathematical methods research')
              r_type = os.environ.get('REPORT_TYPE', 'research_report')
              
              print(f'🤖 Đang nghiên cứu đề tài: {query}')
              researcher = GPTResearcher(query=query, report_type=r_type, report_format='markdown')
              await researcher.conduct_research()
              report = await researcher.write_report()
              
              os.makedirs('reports', exist_ok=True)
              with open('reports/output_report.md', 'w', encoding='utf-8') as f:
                  f.write(report)
              print('✅ Đã lưu báo cáo thành công vào reports/output_report.md')

          asyncio.run(main())
          "

      - name: 6. Upload Research Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-research-report
          path: reports/output_report.md
