name: Pure Python Groq Research

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai anthropic duckduckgo_search pyyaml

      - name: Get current date in Vietnam timezone
        id: date
        run: echo "date=$(TZ='Asia/Ho_Chi_Minh' date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Run Research Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
          RUN_DATE: ${{ steps.date.outputs.date }}
        run:  python research.py

      - name: Upload All Reports as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hsg9-math-reports-${{ steps.date.outputs.date }}
          path: hsg9_reports/
