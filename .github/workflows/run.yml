name: Pure Python Gemini Research

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Chạy tự động mỗi ngày lúc 7:00 sáng giờ VN

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai duckduckgo_search

      - name: Run Research Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python research.py

      - name: Upload All Reports as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-research-reports
          path: reports/
