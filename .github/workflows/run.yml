name: GPT-Researcher DuckDuckGo Run

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade langchain-google-genai google-genai duckduckgo_search

      - name: Run Researcher with DuckDuckGo and Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import asyncio
          import os
          from gpt_researcher import GPTResearcher

          async def main():
              query = 'Extract advanced mathematical methods and theorems'
              print(f'Starting research on: {query}')
              
              # Cấu hình dùng DuckDuckGo làm retriever và Gemini cho phần xử lý ngôn ngữ
              researcher = GPTResearcher(
                  query=query, 
                  report_type='research_report', 
                  report_format='markdown',
                  retriever='duckduckgo',
                  llm_provider='google_genai',
                  fast_llm='gemini-3.1-pro-preview',
                  smart_llm='gemini-3.1-pro-preview',
                  strategic_llm='gemini-3.1-pro-preview'
              )
              
              await researcher.conduct_research()
              report = await researcher.write_report()

              os.makedirs('reports', exist_ok=True)
              with open('reports/math_report.md', 'w', encoding='utf-8') as f:
                  f.write(report)
              print('Research completed successfully!')

          asyncio.run(main())
          "

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathematical-methods-report
          path: reports/math_report.md
