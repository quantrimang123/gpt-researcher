name: Pure Python Gemini Research

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Chạy tự động mỗi ngày lúc 7:00 sáng giờ VN

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền ghi để script tự động push file báo cáo vào repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai duckduckgo_search ddgs

      - name: Run Research Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python research.py

      - name: Commit & Push report files back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hsg9_reports/
          git commit -m "Auto-generate HSG 9 math reports batch [skip ci]" || exit 0
          git push

      - name: Upload All Reports as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hsg9-math-reports
          path: hsg9_reports/
